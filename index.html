<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script data-forward>
      var p = new URLSearchParams(location.search);
      if (['fresh', 'cheat', 'word', 'duck', 'st'].some(function (f) { return p.has(f) }))
        location.replace('/portfolio/play/' + location.search + location.hash);
    </script>
    <script>
      try { if (localStorage.getItem('pf.theme') === 'light') document.documentElement.dataset.theme = 'light' } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!--resume-head-->
  </head>
  <body>
    <!--resume-->
    <script type="module" src="/src/resume/main.ts"></script>
  </body>
</html>
